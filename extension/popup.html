<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="page">
      <div id="pageTitle" class="page-title">…</div>
      <div id="pageHost" class="page-host"></div>
    </div>
  </header>

  <div class="actions">
    <button id="btnAudio" class="primary">🎧 Save audio <span>MP3</span></button>
    <button id="btnVideo">🎬 Save video <span>MP4</span></button>
  </div>
  <div id="detected" class="detected"></div>

  <div id="helperWarn" class="warn" hidden>
    <strong>Helper not installed.</strong> In Terminal run:<br>
    <code>./install.sh</code> in the <code>video-rip</code> folder, then reload this extension.
  </div>

  <section>
    <div class="section-head">
      <span>Downloads</span>
      <span class="links"><a href="#" id="openFolder">Open folder</a> · <a href="#" id="clear">Clear</a></span>
    </div>
    <ul id="jobs"></ul>
    <div id="empty" class="empty">Nothing yet. Files go to <span id="outDir">~/Downloads/VideoRip</span>.</div>
  </section>

  <footer id="footer"></footer>
  <script src="popup.js"></script>
</body>
</html>
